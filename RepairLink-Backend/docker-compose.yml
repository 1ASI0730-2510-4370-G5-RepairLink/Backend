version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: repairlink
      MYSQL_USER: repairuser
      MYSQL_PASSWORD: repairpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mysql
    environment:
          - ConnectionStrings__DefaultConnection=server=mysql;port=3306;user=repairuser;password=repairpass;database=repairlink
    ports:
      - "5000:80"

volumes:
  mysql_data:
